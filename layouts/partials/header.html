<div class="container mt-5">
    <nav class="navbar navbar-expand-sm flex-column text-nowrap p-0" style="align-items:flex-start; gap:1rem;">
        <div class="navbar-nav flex-row flex-wrap" style="width:100%; justify-content:space-between; padding-left:5px; padding-right:5px">
            {{ range .Site.Menus.main }}
                <a class="nav-item nav-link" href="{{ .URL | relURL }}" title="{{ .Name }}">
                    {{ .Pre }}{{ .Name }}{{ .Post }}
                </a>
            {{ end }}
        </div>
        <div>
            <a class="navbar-brand mx-0" href="{{ .Site.BaseURL }}" style="display:block; white-space:normal; font-size:1.7rem; font-weight:bold">
                {{ with .Site.Params.logo }}
                    <img src="{{ . | absURL }}" alt="logo">
                {{ end }}
                {{ .Site.Title }}
            </a>
            {{ with .Site.Params.subtitle }}
                <div style="font-size:20px; color:#fff;">{{ . | markdownify }}</div>
            {{ end }}
        </div>
    </nav>
</div>
<hr>
